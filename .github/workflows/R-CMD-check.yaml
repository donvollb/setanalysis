# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
    # Kein Check, wenn sich nur Dateien ändern, die R CMD check nicht betreffen
    # (Hilfeseiten und Vignette werden weiter geprüft)
    paths-ignore:
      - "README.md"
      - "README.en.md"
      - "LICENSE.md"
      - "_pkgdown.yml"
      - "man/figures/**"
      - "data-raw/**"
      - ".github/workflows/pkgdown.yaml"
  pull_request:
    paths-ignore:
      - "README.md"
      - "README.en.md"
      - "LICENSE.md"
      - "_pkgdown.yml"
      - "man/figures/**"
      - "data-raw/**"
      - ".github/workflows/pkgdown.yaml"
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# Bei einem neuen Push auf denselben Branch den noch laufenden Check abbrechen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Umlaute im R-Code ergeben eine WARNING (bewusst akzeptiert), daher nur bei Fehlern abbrechen
          error-on: '"error"'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
