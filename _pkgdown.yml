url: https://donvollb.github.io/setanalysis/
lang: de

template:
  bootstrap: 5
  bslib:
    primary: "#507289"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, english, github]
  components:
    intro:
      text: Anleitung
      href: articles/bericht-erstellen.html
    english:
      text: English
      href: https://github.com/donvollb/setanalysis/blob/main/README.en.md

home:
